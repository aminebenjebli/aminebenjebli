name: GitHub stats dashboard

on:
  # GitHub Actions can't watch activity in other repos (e.g. a private employer repo)
  # directly, only pushes to *this* repo. Running every 15 minutes instead of once a
  # day is the practical equivalent: within 15 minutes of a commit anywhere on the
  # account, the next run picks it up. This repo is public, so Actions minutes are
  # unlimited and this costs nothing.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node github-stats/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USER: aminebenjebli
          UTC_OFFSET: 1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add github-stats/dashboard.svg
          git diff --staged --quiet || git commit -m "chore: update stats dashboard"
          git push
