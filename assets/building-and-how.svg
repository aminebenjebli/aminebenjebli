<text x="342.0" y="92" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E8F4FD">Web Platform</text>
<text x="342.0" y="116" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">Next.js dashboards and client</text>
<text x="342.0" y="134" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">portals backed by typed NestJS</text>
<text x="342.0" y="152" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">APIs and a shared design system.</text>
<rect x="612.0" y="4" width="266.0" height="190" rx="14" fill="url(#cardG)" stroke="#16365F" stroke-width="1"/>
<rect x="632.0" y="24" width="40" height="40" rx="10" fill="#85B7EB" fill-opacity="0.12" stroke="#85B7EB" stroke-opacity="0.4"/>
<circle cx="652.0" cy="44.0" r="13" fill="none" stroke="#85B7EB" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="652.0" cy="44.0" r="2.4" fill="#85B7EB"/>
<text x="632.0" y="92" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E8F4FD">DevOps &amp; Delivery</text>
<text x="632.0" y="116" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">Docker, GitHub Actions and</text>
<text x="632.0" y="134" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">environment-based pipelines:</text>
<text x="632.0" y="152" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">every merge is tested, built and</text>
<text x="632.0" y="170" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">deployable.</text>
