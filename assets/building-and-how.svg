<text x="342.0" y="358" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E8F4FD">Enforced boundaries</text>
<text x="342.0" y="394" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">Module boundaries checked by</text>
<text x="342.0" y="412" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">static analysis in CI, so</text>
<text x="342.0" y="430" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">architectural rules can't</text>
<text x="342.0" y="448" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">quietly erode as the codebase</text>
<text x="342.0" y="466" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">grows.</text>
