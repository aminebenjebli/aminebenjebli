<text x="52.0" y="358" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E8F4FD">Domain-Driven Design</text>
<text x="52.0" y="394" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">Backend modules structured</text>
<text x="52.0" y="412" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">around bounded contexts, with</text>
<text x="52.0" y="430" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">domain logic kept framework-free</text>
<text x="52.0" y="448" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">and unit-tested in isolation.</text>
