<text x="52.0" y="92" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E8F4FD">Mobile SaaS</text>
<text x="52.0" y="116" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">Cross-platform and native apps</text>
<text x="52.0" y="134" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">with offline-first data, secure</text>
<text x="52.0" y="152" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">auth and clean modular</text>
<text x="52.0" y="170" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">architecture.</text>
