<text x="632.0" y="358" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E8F4FD">Decision records</text>
<text x="632.0" y="394" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">Significant architecture</text>
<text x="632.0" y="412" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">decisions written as ADRs, with</text>
<text x="632.0" y="430" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">the trade-offs considered and</text>
<text x="632.0" y="448" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#8FAECF">rejected, not just the outcome.</text>
