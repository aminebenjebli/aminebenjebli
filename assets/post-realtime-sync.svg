<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="291" viewBox="0 0 1200 291"><defs><linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2849"/><stop offset="1" stop-color="#081A33"/></linearGradient><radialGradient id="sheen" cx="0.1" cy="0" r="0.9"><stop offset="0" stop-color="#9FC8F2" stop-opacity="0.09"/><stop offset="1" stop-color="#9FC8F2" stop-opacity="0"/></radialGradient><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FA9D6" stop-opacity="0.55"/><stop offset="0.35" stop-color="#2A5384" stop-opacity="0.6"/><stop offset="1" stop-color="#16365F" stop-opacity="0.7"/></linearGradient></defs><rect x="20" y="6" width="1160" height="279" rx="18" fill="url(#cardG)"/><rect x="20" y="6" width="1160" height="279" rx="18" fill="url(#sheen)"/><rect x="20.5" y="6.5" width="1159" height="278" rx="18" fill="none" stroke="url(#edge)"/><rect x="60" y="37" width="34" height="20" rx="4" fill="#E8F4FD"/><text x="77.0" y="52.0" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0A0A0A" text-anchor="middle">DEV</text><text x="106.0" y="52.0" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#7FA9D6" text-anchor="start" letter-spacing="1.4">ARTICLE ON DEV.TO</text><text x="60.0" y="96.0" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#E8F4FD" text-anchor="start">Keeping real-time clients in sync after they</text><text x="60.0" y="129.0" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#E8F4FD" text-anchor="start">reconnect</text><text x="60.0" y="165.0" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#B7CDE6" text-anchor="start">WebSockets drop. Phones sleep. Most apps assume every event arrives, and quietly show</text><text x="60.0" y="189.0" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#B7CDE6" text-anchor="start">stale data when one doesn't. Number every event, let the client notice a gap, and treat a plain</text><text x="60.0" y="213.0" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#B7CDE6" text-anchor="start">REST read as the source of truth.</text><text x="60.0" y="257.0" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#22D3EE" text-anchor="start">Read the post  →</text><line x1="830" y1="129.5" x2="1130" y2="129.5" stroke="#2A5384" stroke-width="2"/><circle cx="830.0" cy="129.5" r="15" fill="#0A2142" stroke="#378ADD" stroke-width="1.8"/><text x="830.0" y="134.5" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#E8F4FD" text-anchor="middle">1</text><circle cx="905.0" cy="129.5" r="15" fill="#0A2142" stroke="#378ADD" stroke-width="1.8"/><text x="905.0" y="134.5" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#E8F4FD" text-anchor="middle">2</text><circle cx="980.0" cy="129.5" r="15" fill="#081A33" stroke="#FF6B6B" stroke-width="1.6" stroke-dasharray="4 4"/><text x="980.0" y="134.5" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#FF6B6B" text-anchor="middle">3</text><text x="980.0" y="103.5" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#FF6B6B" text-anchor="middle">missed</text><circle cx="1055.0" cy="129.5" r="15" fill="#0A2142" stroke="#378ADD" stroke-width="1.8"/><text x="1055.0" y="134.5" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#E8F4FD" text-anchor="middle">4</text><circle cx="1130.0" cy="129.5" r="15" fill="#0A2142" stroke="#378ADD" stroke-width="1.8"/><text x="1130.0" y="134.5" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#E8F4FD" text-anchor="middle">5</text><path d="M905.0,153.5 C905.0,187.5 1055.0,187.5 1055.0,153.5" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M1050.0,159.5 L1055.0,152.5 L1060.0,159.5" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="980.0" y="203.5" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#22D3EE" text-anchor="middle">GET /changes?after=2</text></svg>
